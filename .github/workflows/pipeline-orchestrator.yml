name: Complete Pipeline Orchestrator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # FASE 1: BUILD & TEST FOUNDATION
  # ============================================
  build-and-test:
    name: "🔨 Phase 1: Build & Test"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ============================================
  # FASE 2: CODE QUALITY ANALYSIS
  # Dipende da: Phase 1 (build-and-test)
  # ============================================
  code-quality:
    name: "📊 Phase 2: Code Quality (SonarCloud)"
    needs: build-and-test
    if: success()
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit

  # ============================================
  # FASE 3: PERFORMANCE BENCHMARKS
  # Dipende da: Phase 1 (build-and-test)
  # Esegue in parallelo con Phase 2
  # ============================================
  performance-testing:
    name: "⚡ Phase 3: Performance Benchmarks"
    needs: build-and-test
    if: success()
    uses: ./.github/workflows/performance-regression.yml
    secrets: inherit

  # ============================================
  # FASE 4: DOCKER BUILD & PUSH
  # Dipende da: Phase 1, Phase 2, Phase 3
  # Solo se qualità e performance sono OK
  # ============================================
  docker-build:
    name: "🐳 Phase 4: Docker Build & Push"
    needs: [build-and-test, code-quality, performance-testing]
    if: success()
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  # ============================================
  # FASE 5: DOCUMENTATION GENERATION
  # Dipende da: Phase 4 (docker-build)
  # ============================================
  generate-report:
    name: "📄 Phase 5a: Generate LaTeX Report"
    needs: docker-build
    if: success()
    uses: ./.github/workflows/latex-pdf.yml
    secrets: inherit
  
  generate-presentation:
    name: "📊 Phase 5b: Generate Presentation"
    needs: docker-build
    if: success()
    uses: ./.github/workflows/presentation-pdf.yml
    secrets: inherit

  # ============================================
  # FASE 6: PIPELINE SUMMARY & STATUS REPORT
  # Dipende da: Tutte le fasi precedenti
  # ============================================
  pipeline-summary:
    name: "📋 Phase 6: Pipeline Summary"
    needs: [build-and-test, code-quality, performance-testing, docker-build, generate-report, generate-presentation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "## 🎯 Complete Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Phases Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Phase 1 | Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Phase 2 | Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Success' || needs.code-quality.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Phase 3 | Performance | ${{ needs.performance-testing.result == 'success' && '✅ Success' || needs.performance-testing.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Phase 4 | Docker Build | ${{ needs.docker-build.result == 'success' && '✅ Success' || needs.docker-build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 Phase 5a | LaTeX Report | ${{ needs.generate-report.result == 'success' && '✅ Success' || needs.generate-report.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Phase 5b | Presentation | ${{ needs.generate-presentation.result == 'success' && '✅ Success' || needs.generate-presentation.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Pipeline Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-and-test.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.performance-testing.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "✅ **All critical phases completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The complete dependability analysis pipeline executed without errors." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline failed - review phase details above**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit Information" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏱️ **Triggered**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if critical phases failed
        if: needs.build-and-test.result == 'failure' || needs.code-quality.result == 'failure' || needs.docker-build.result == 'failure'
        run: |
          echo "::error::Pipeline execution failed - critical phases did not complete successfully"
          exit 1
