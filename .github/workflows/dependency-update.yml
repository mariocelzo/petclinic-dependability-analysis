name: Dependency Updates

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check and Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Check for dependency updates
        run: |
          echo "=== Checking for Maven dependency updates ==="
          ./mvnw versions:display-dependency-updates -DprocessDependencyManagement=false > dependency-updates.log
          cat dependency-updates.log
      
      - name: Check for plugin updates
        run: |
          echo "=== Checking for Maven plugin updates ==="
          ./mvnw versions:display-plugin-updates > plugin-updates.log
          cat plugin-updates.log
      
      - name: Update to latest versions
        run: |
          echo "=== Updating dependencies to latest versions ==="
          ./mvnw versions:use-latest-versions -DallowMajorUpdates=false -DallowMinorUpdates=true
          ./mvnw versions:use-latest-releases -DallowMajorUpdates=false
      
      - name: Clean up backup files
        run: |
          find . -name "pom.xml.versionsBackup" -delete
      
      - name: Build with updated dependencies
        id: build
        continue-on-error: true
        run: |
          ./mvnw clean compile
      
      - name: Run tests with updated dependencies
        id: test
        continue-on-error: true
        run: |
          ./mvnw test
      
      - name: Run security checks
        id: security
        continue-on-error: true
        run: |
          ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
      - name: Generate update summary
        run: |
          echo "## 🔄 Dependency Update Summary" > update-summary.md
          echo "" >> update-summary.md
          echo "### Build Status" >> update-summary.md
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Build: **Passed**" >> update-summary.md
          else
            echo "❌ Build: **Failed**" >> update-summary.md
          fi
          
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "✅ Tests: **Passed**" >> update-summary.md
          else
            echo "❌ Tests: **Failed**" >> update-summary.md
          fi
          
          if [ "${{ steps.security.outcome }}" == "success" ]; then
            echo "✅ Security: **No high vulnerabilities**" >> update-summary.md
          else
            echo "⚠️ Security: **Review required**" >> update-summary.md
          fi
          
          echo "" >> update-summary.md
          echo "### Available Updates" >> update-summary.md
          echo "\`\`\`" >> update-summary.md
          grep -A 3 "The following dependencies in Dependencies have newer versions:" dependency-updates.log || echo "No dependency updates available"
          echo "\`\`\`" >> update-summary.md
          
          cat update-summary.md
      
      - name: Upload update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-reports
          path: |
            dependency-updates.log
            plugin-updates.log
            update-summary.md
            target/dependency-check-report.html
          retention-days: 30
      
      - name: Create Pull Request
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update Maven dependencies"
          title: "🔄 Automated Dependency Update"
          body-path: update-summary.md
          branch: dependency-updates
          delete-branch: true
          labels: dependencies,automated
          assignees: mariocelzo
